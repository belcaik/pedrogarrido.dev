<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="96" height="96" rx="20" ry="20"
    fill="#111118" stroke="#00d4aa" stroke-width="2" />
  <!-- PG monogram text -->
  <text x="50" y="58" text-anchor="middle" dominant-baseline="middle"
    font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700"
    fill="#eaedf0">PG</text>
  <!-- Corner bracket accent (bottom-left) -->
  <polyline points="20,65 20,80 35,80"
    fill="none" stroke="#00d4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
