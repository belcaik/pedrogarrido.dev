<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="80%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="#0e1a17"/>
      <stop offset="40%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="teal-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a88a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="#00d4aa" opacity="0.06"/>
  <circle cx="100" cy="530" r="150" fill="#58a6ff" opacity="0.06"/>

  <!-- PG Monogram Logo -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="140" height="140" rx="28" ry="28"
      fill="#111118" stroke="#00d4aa" stroke-width="3"/>
    <text x="70" y="82" text-anchor="middle" dominant-baseline="middle"
      font-family="'JetBrains Mono', monospace" font-size="52" font-weight="700"
      fill="#eaedf0">PG</text>
    <polyline points="28,95 28,115 48,115"
      fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main text -->
  <text x="280" y="265" font-family="'JetBrains Mono', monospace" font-size="72" font-weight="700" fill="#eaedf0">
    Pedro Garrido
  </text>

  <!-- Subtitle -->
  <text x="280" y="335" font-family="'DM Sans', sans-serif" font-size="32" fill="#9ca3af">
    Software Engineer &amp; DevOps Enthusiast
  </text>

  <!-- Tech tags -->
  <g font-family="'JetBrains Mono', monospace" font-size="16" fill="#eaedf0">
    <rect x="280" y="380" width="108" height="36" rx="6" fill="#00d4aa" opacity="0.15"/>
    <text x="334" y="403" text-anchor="middle">.NET Core</text>

    <rect x="400" y="380" width="84" height="36" rx="6" fill="#00d4aa" opacity="0.15"/>
    <text x="442" y="403" text-anchor="middle">NestJS</text>

    <rect x="496" y="380" width="76" height="36" rx="6" fill="#00d4aa" opacity="0.15"/>
    <text x="534" y="403" text-anchor="middle">React</text>

    <rect x="584" y="380" width="88" height="36" rx="6" fill="#58a6ff" opacity="0.15"/>
    <text x="628" y="403" text-anchor="middle">DevOps</text>

    <rect x="684" y="380" width="64" height="36" rx="6" fill="#58a6ff" opacity="0.15"/>
    <text x="716" y="403" text-anchor="middle">AWS</text>
  </g>

  <!-- Website URL -->
  <text x="280" y="500" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="url(#teal-gradient)">
    pedrogarrido.dev
  </text>

  <!-- Subtle border line -->
  <line x1="280" y1="440" x2="748" y2="440" stroke="#1e1e2e" stroke-width="1"/>
</svg>
