<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="80%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="40%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#120e1c"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b366e0"/>
      <stop offset="50%" stop-color="#933cdc"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="#7b2cbf" opacity="0.1"/>
  <circle cx="100" cy="530" r="150" fill="#933cdc" opacity="0.1"/>

  <!-- Logo representation (simplified geometric shape) -->
  <g transform="translate(100, 215)">
    <path d="M0 100 L50 0 L100 100 L50 100 Z" fill="#bb9af7"/>
    <path d="M50 100 L100 100 L150 200 L100 200 Z" fill="#9d7cd8"/>
    <path d="M0 100 L50 100 L100 200 L50 200 Z" fill="#f7768e"/>
  </g>

  <!-- Main text -->
  <text x="280" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ebebf0">
    Pedro Garrido
  </text>

  <!-- Subtitle -->
  <text x="280" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#a09baa">
    Software Developer
  </text>

  <!-- Tech tags -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#c8b4dc">
    <rect x="280" y="400" width="100" height="36" rx="6" fill="#4a0e4e" opacity="0.6"/>
    <text x="330" y="424" text-anchor="middle">.NET Core</text>

    <rect x="395" y="400" width="80" height="36" rx="6" fill="#4a0e4e" opacity="0.6"/>
    <text x="435" y="424" text-anchor="middle">NestJS</text>

    <rect x="490" y="400" width="70" height="36" rx="6" fill="#4a0e4e" opacity="0.6"/>
    <text x="525" y="424" text-anchor="middle">React</text>

    <rect x="575" y="400" width="80" height="36" rx="6" fill="#4a0e4e" opacity="0.6"/>
    <text x="615" y="424" text-anchor="middle">DevOps</text>

    <rect x="670" y="400" width="60" height="36" rx="6" fill="#4a0e4e" opacity="0.6"/>
    <text x="700" y="424" text-anchor="middle">AWS</text>
  </g>

  <!-- Website URL -->
  <text x="280" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="url(#text-gradient)">
    pedrogarrido.dev
  </text>
</svg>
